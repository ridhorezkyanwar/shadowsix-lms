services:
  - type: web
    name: shadowsix-app
    runtime: docker
    repo: https://github.com/ridhorezkyanwar/shadowsix-lms.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "26573"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: shadowsix_app
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "1"
      - key: DB_SSL_CA
        value: ""
      - key: DB_BOOTSTRAP_HOST
        sync: false
      - key: DB_BOOTSTRAP_USER
        value: avnadmin
      - key: DB_BOOTSTRAP_PORT
        value: "26573"
      - key: DB_BOOTSTRAP_SSL
        value: "1"
      - key: DB_BOOTSTRAP_SSL_CA
        value: ""
      - key: DB_BOOTSTRAP_PASSWORD
        sync: false
      - key: SHADOWSIX_AUTO_INIT_SCHEMA
        value: "1"
