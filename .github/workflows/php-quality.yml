name: PHP quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: shadowsix_ci
          MARIADB_USER: shadowsix_ci
          MARIADB_PASSWORD: shadowsix_ci_password
          MARIADB_ROOT_PASSWORD: shadowsix_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_USER: shadowsix_ci
      DB_PASSWORD: shadowsix_ci_password
      DB_NAME: shadowsix_ci
      DB_ROOT_PASSWORD: shadowsix_ci_root_password
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, fileinfo, dom
          coverage: none

      - name: Verify PHP runtime
        run: |
          php --version
          php -m

      - name: Lint every PHP file
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run security helper tests
        run: php tests/security_helpers_test.php

      - name: Run read-only schema preflight
        run: php scripts/db_preflight.php --schema-only

      - name: Verify MariaDB schema and application CRUD
        run: php tests/database_integration_test.php

      - name: Verify live read-only database preflight
        run: php scripts/db_preflight.php

      - name: Validate container configuration
        run: docker compose config --quiet

      - name: Build and smoke-test the PHP + MariaDB stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --build -d
          cleanup() {
            docker compose down -v --remove-orphans
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/health.php | grep -Fxq '{"status":"ok"}'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          curl --fail --silent --show-error http://127.0.0.1:8080/index.php -o /tmp/shadowsix-home.html
          grep -qi 'ShadowSix' /tmp/shadowsix-home.html
          for path in /Dockerfile /docker-compose.yml /shadowsix.sql /README.md /.env.example; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8080${path}")"
            if [[ "$status" == "200" ]]; then
              echo "::error::Private project file was publicly served: ${path}"
              exit 1
            fi
          done

      - name: Check for private database exports and hard-coded database passwords
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname 'ridho10_shadowsix.sql' -o -iname '*backup*.sql' -o -iname '*dump*.sql' -o -iname '*.sql.gz' -o -iname '*.dump' \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "::error::A private database export or backup is present in the repository."
            exit 1
          fi
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          assignment_patterns = [
              re.compile(r"""(?i)\$password_db\s*=\s*["'][^"']+["']"""),
              re.compile(r"""(?i)(?:DB_PASSWORD|PASSWORD_DB)\s*[:=]\s*["'][^"']+["']"""),
          ]
          matches = []
          for path in Path(".").rglob("*.php"):
              if ".git" in path.parts:
                  continue
              content = path.read_text(encoding="utf-8", errors="replace")
              if any(pattern.search(content) for pattern in assignment_patterns):
                  matches.append(str(path))
          if matches:
              print("Potential hard-coded database password assignment found in: " + ", ".join(matches))
              sys.exit(1)
          print("PASS: no obvious hard-coded database password assignments in PHP files.")
          PY

      - name: Package cPanel deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/shadowsix-cpanel-bundle"
          mkdir -p "$bundle/public_html" "$bundle/database"

          while IFS= read -r -d '' source; do
            case "$source" in
              .github/*|.git/*|tests/*|docker/*|scripts/*|Dockerfile|.dockerignore|docker-compose.yml|.env.example|.htaccess.example|README.md|DEPLOYMENT.md|.gitignore|*.html|*.sql|*.sql.gz|*.dump|*backup*|*.log)
                continue
                ;;
            esac
            destination="$bundle/public_html/$source"
            mkdir -p "$(dirname "$destination")"
            cp -- "$source" "$destination"
          done < <(git ls-files -z)

          cp shadowsix.sql "$bundle/database/shadowsix.sql"

          test -f "$bundle/public_html/index.php"
          test ! -e "$bundle/public_html/index.html"
          test -f "$bundle/public_html/.htaccess"
          test -f "$bundle/public_html/uploads/.htaccess"
          test -f "$bundle/database/shadowsix.sql"
          if find "$bundle/public_html" -type f -name '*.html' -print -quit | grep -q .; then
            echo "::error::Legacy non-PHP HTML pages must not be included in the cPanel bundle."
            exit 1
          fi

          (
            cd dist
            zip -qr shadowsix-cpanel-bundle.zip shadowsix-cpanel-bundle
            sha256sum shadowsix-cpanel-bundle.zip > shadowsix-cpanel-bundle.sha256
          )

      - name: Upload cPanel deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: shadowsix-cpanel-bundle
          path: |
            dist/shadowsix-cpanel-bundle.zip
            dist/shadowsix-cpanel-bundle.sha256
          if-no-files-found: error
          retention-days: 14
