name: Deploy ShadowSix to PHP.ID cPanel

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview FTPS changes only. Keep true for the first run."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: shadowsix-phpid-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish PHP application over FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify credentials and fixed cPanel destination
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.PHPID_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.PHPID_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PHPID_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub repository secret: PHPID_${name}"
              exit 1
            fi
          done

          if [[ "$FTP_SERVER" == *"://"* || "$FTP_SERVER" == *"/"* || "$FTP_SERVER" == *" "* ]]; then
            echo "::error::PHPID_FTP_SERVER must be only the FTPS hostname from the provider panel."
            exit 1
          fi

          test -f index.php
          test -f .htaccess
          test -f config.local.example.php
          test -f shadowsix.sql
          test -f uploads/.htaccess
          echo "PASS: application files found; the destination is fixed to cPanel public_html/."

      - name: Preview or deploy over strict FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.PHPID_FTP_SERVER }}
          username: ${{ secrets.PHPID_FTP_USERNAME }}
          password: ${{ secrets.PHPID_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./
          server-dir: public_html/
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/*.html
            **/README*
            **/DEPLOYMENT.md
            **/Dockerfile
            **/.dockerignore
            **/docker-compose.yml
            **/.env*
            **/config.local.php
            **/config.local.example.php
            **/scripts/**
            **/tests/**
            **/docker/**
            **/*.sql
            **/*.sql.gz
            **/*.dump
            **/*.log
            **/*.bak
            **/*.example
            **/uploads/materi/**
            **/uploads/mapel/**
