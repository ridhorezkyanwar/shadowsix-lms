name: Deploy ShadowSix to HelioHost

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview FTPS changes only. Keep true for the first run."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: shadowsix-heliohost-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish PHP application over strict FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify hosting secrets and safe destination
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.HELIOHOST_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HELIOHOST_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          for name in FTP_USERNAME FTP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: HELIOHOST_${name#FTP_}"
              exit 1
            fi
          done

          # This workflow targets the free HelioHost Johnny server only.
          # The path is fixed below so secrets cannot redirect uploads.
          test -f index.php
          test -f .htaccess
          test -f config.local.example.php
          test -f shadowsix.sql
          test -f uploads/.htaccess
          echo "PASS: required files exist; destination is pinned to Johnny/httpdocs."

      - name: Preview or deploy files over strict FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: johnny.heliohost.org
          username: ${{ secrets.HELIOHOST_FTP_USERNAME }}
          password: ${{ secrets.HELIOHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./ 
          server-dir: httpdocs/
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/README*
            **/DEPLOYMENT.md
            **/Dockerfile
            **/.dockerignore
            **/docker-compose.yml
            **/.env*
            **/config.local.php
            **/config.local.example.php
            **/scripts/**
            **/tests/**
            **/docker/**
            **/*.sql
            **/*.sql.gz
            **/*.dump
            **/*.log
            **/*.bak
            **/*.example
            **/uploads/materi/**
            **/uploads/mapel/**
