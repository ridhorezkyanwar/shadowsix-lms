name: Deploy ShadowSix to InfinityFree

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview FTP changes only. Leave true for the first run."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: shadowsix-infinityfree-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish PHP application over FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify hosting secrets and safe destination
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

          # InfinityFree's site root is htdocs/. Fail closed rather than sync
          # against an account home/root or a path outside the expected folder.
          if [[ "$FTP_SERVER_DIR" != "htdocs/" ]]; then
            echo "::error::FTP_SERVER_DIR must be exactly htdocs/ for InfinityFree."
            exit 1
          fi

          if [[ "$FTP_SERVER" == *"://"* || "$FTP_SERVER" == *"/"* ]]; then
            echo "::error::FTP_SERVER must be a hostname only, without a protocol or path."
            exit 1
          fi

          test -f index.php
          test -f .htaccess
          test -f config.local.example.php
          test -f shadowsix.sql
          echo "PASS: deployment destination and required application files are present."

      - name: Preview or deploy files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/README*
            **/DEPLOYMENT.md
            **/Dockerfile
            **/.dockerignore
            **/docker-compose.yml
            **/.env*
            **/config.local.php
            **/config.local.example.php
            **/scripts/**
            **/tests/**
            **/docker/**
            **/*.sql
            **/*.sql.gz
            **/*.dump
            **/*.log
            **/*.bak
            **/*.example
            **/uploads/materi/**
            **/uploads/mapel/**
