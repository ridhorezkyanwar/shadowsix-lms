name: shadowsix-lms

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-shadowsix}
      MARIADB_USER: ${DB_USER:-shadowsix}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a separate DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./shadowsix.sql:/docker-entrypoint-initdb.d/01-shadowsix.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-shadowsix}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-shadowsix}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - uploads_data:/var/www/html/uploads
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  uploads_data:
